# Charybdis Nano Configuration
# OSM ベース keymap 用

# Bluetooth
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="Charybdis Ogata"

# USB（充電時）
CONFIG_ZMK_USB=y

# BLE接続パラメータ（初回入力ドロップ対策）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_BUF_ACL_TX_COUNT=16
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_BUF_EVT_RX_COUNT=20

# アイドル無効化（入力ドロップ防止）
CONFIG_ZMK_IDLE_TIMEOUT=86400000

# デバウンス設定
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# スリープ無効化
CONFIG_ZMK_SLEEP=n
